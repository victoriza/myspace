<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E2952" />
    <!--seo-head-->
    <title>Space Feed</title>
    <!--/seo-head-->
    <script>
      // Evening theme before the first paint (no bright flash at night): same hours as the sky, or the phone's dark mode.
      try { var h = new Date().getHours() + new Date().getMinutes() / 60; if (h >= 20.38 || h < 6.6 || matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'night' } catch (e) {}
      // Returning visitors go straight to the app: hide the landing text until it starts.
      try { if (localStorage.getItem('sf.settings.v1')) document.documentElement.classList.add('returning') } catch (e) {}
    </script>
    <style>
      .returning #prerender { display: none; }
      .pre { font-family: 'Inter Variable', system-ui, sans-serif; color: #172036; background: #f7f3ea; min-height: 100dvh; max-width: 520px; margin: 0 auto; }
      .pre-hero { background: linear-gradient(180deg, #3f4380, #8a5e8a 55%, #e08a6e); color: #fff; padding: 28px 22px 26px; }
      .pre-brand { font: 700 18px 'Space Grotesk Variable', 'Inter Variable', sans-serif; margin: 0 0 18px; }
      .pre h1 { font: 600 28px/1.2 'Source Serif 4 Variable', Georgia, serif; margin: 0 0 10px; }
      .pre-intro { margin: 0 0 18px; line-height: 1.45; }
      .pre-cta { display: inline-block; background: #fff; color: #1e2952; padding: 12px 18px; border-radius: 999px; font-weight: 600; text-decoration: none; }
      .pre-main { padding: 18px 22px; }
      .pre h2 { font-size: 16px; margin: 18px 0 8px; }
      .pre-list { margin: 0; padding-left: 18px; line-height: 1.5; display: grid; gap: 8px; }
      .pre-foot { padding: 0 22px 28px; font-size: 14px; color: #4a5468; }
      .pre-foot a { color: #1e2952; }
    </style>  </head>
  <body>
    <div id="root"><!--seo-body--><!--/seo-body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
